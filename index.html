<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Студенческий портал</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/calendar.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <main>
    <header class="site-header">
      <img class="site-logo" src="assets/logo.svg" alt="Логотип" width="600" height="216">
      <button class="menu-toggle" type="button" aria-label="Открыть меню" aria-haspopup="dialog" aria-controls="site-menu" aria-expanded="false"><span></span><span></span></button>
    </header>
    <dialog id="site-menu" class="menu-panel" aria-labelledby="menu-title">
      <div class="menu-top"><h2 id="menu-title">Меню</h2><button class="menu-close" type="button" aria-label="Закрыть меню">×</button></div>
      <nav class="menu-navigation" aria-label="Разделы портала">
        <button type="button" data-section="homework" aria-controls="content" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z M14 3v5h5 M9 12h7 M9 16h5"/></svg><span>Домашние задания</span>
        </button>
        <button type="button" data-section="map" aria-controls="content" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2z M9 3v16 M15 5v16"/></svg><span>Карта</span>
        </button>
        <button type="button" data-section="schedule" aria-controls="content" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4 M17 3v4 M3 10h18 M7 14h3 M14 14h3 M7 17h3"/></svg><span>Расписание</span>
        </button>
      </nav>
    </dialog>
    <section id="content" aria-live="polite" aria-atomic="true">
      <h2 id="section-title">Домашние задания</h2>
      <p id="section-description">Задания и сроки из Telegram. Дату можно выбрать вручную или рассчитывать по расписанию.</p>
    </section>
    <footer>Задания и расписание · Карта в разработке</footer>
  </main>
</body>
</html>
